<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="title desc">
  <title id="title">Mathematical AI research background</title>
  <desc id="desc">An abstract dark grid with equations, vectors, and neural network connections</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset=".52" stop-color="#10243c"/>
      <stop offset="1" stop-color="#091018"/>
    </linearGradient>
    <radialGradient id="halo" cx="72%" cy="40%" r="60%">
      <stop offset="0" stop-color="#2386d8" stop-opacity=".38"/>
      <stop offset="1" stop-color="#2386d8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#8bb9df" stroke-opacity=".1"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="16"/></filter>
  </defs>
  <rect width="1600" height="520" fill="url(#bg)"/>
  <rect width="1600" height="520" fill="url(#grid)"/>
  <rect width="1600" height="520" fill="url(#halo)"/>
  <g fill="none" stroke="#72b7f2" stroke-opacity=".4" stroke-width="2">
    <path d="M820 418C930 290 1000 365 1090 215S1260 90 1435 155"/>
    <path d="M880 460C1010 330 1080 410 1170 260s160-125 290-58"/>
    <path d="M950 112l145 88 132-95 158 74"/>
  </g>
  <g stroke="#58a6ff" stroke-width="3" stroke-opacity=".72">
    <path d="M1010 160 1120 245 1230 170 1350 250"/><path d="M1120 245 1168 370 1280 320"/>
  </g>
  <g fill="#bfe3ff">
    <circle cx="1010" cy="160" r="7"/><circle cx="1120" cy="245" r="7"/><circle cx="1230" cy="170" r="7"/><circle cx="1350" cy="250" r="7"/>
    <circle cx="1168" cy="370" r="7"/><circle cx="1280" cy="320" r="7"/>
  </g>
  <g fill="#b7d9f6" fill-opacity=".34" font-family="Georgia, serif" font-size="38">
    <text x="180" y="150">∇L(θ)</text><text x="270" y="300">f(x) → y</text><text x="510" y="420">Σ wᵢxᵢ + b</text>
  </g>
  <g fill="#d7ecff" fill-opacity=".18" font-family="monospace" font-size="22">
    <text x="1030" y="115">latent space</text><text x="1210" y="445">∂²/∂x²</text><text x="1370" y="105">A · x = b</text>
  </g>
  <rect width="1600" height="520" fill="#05080d" opacity=".2"/>
</svg>
